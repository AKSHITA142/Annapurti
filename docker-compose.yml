version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: foodrescue-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodrescue
      POSTGRES_PASSWORD: foodrescue
      POSTGRES_DB: foodrescue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrescue -d foodrescue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodrescue-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://foodrescue:foodrescue@db:5432/foodrescue_db
      ENVIRONMENT: development
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodrescue-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:

